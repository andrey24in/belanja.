<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Belanja Rumah</title>
<meta name="theme-color" content="#3FB98A">
<script>
/* Dua aplikasi terpisah dari satu file: link keluarga memakai manifest keluarga */
(function(){ var q=new URLSearchParams(location.search), kel=(q.get('mode')==='keluarga'&&q.get('k')==='161010');
  document.write('<link rel="manifest" href="'+(kel?'manifest-keluarga.json':'manifest.json')+'">'
   +'<meta name="apple-mobile-web-app-title" content="'+(kel?'Belanja Keluarga':'Belanja Rumah')+'">');
  if(kel) document.title='Belanja Keluarga'; })();
</script>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--mint:#3FB98A;--mint-d:#0C5B44;--txt:#22251F;--txt2:#6E7278;--txt3:#9a958a;--line:rgba(255,255,255,.7);--danger:#A32D2D;--warn:#8a5a0b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--txt);}
body{background:#EFEBE1;min-height:100vh;min-height:100dvh;overflow-x:hidden;}
/* latar: satu lapisan statis di GPU, tidak dilukis ulang saat scroll */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;transform:translateZ(0);
  background:radial-gradient(circle at 18% 8%,#C9EFE0 0,transparent 42%),radial-gradient(circle at 88% 18%,#DCEAC2 0,transparent 40%),
  radial-gradient(circle at 72% 92%,#CFE8DE 0,transparent 45%),radial-gradient(circle at 20% 84%,#EAD9C0 0,transparent 40%);}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-bottom:calc(92px + env(safe-area-inset-bottom));}
.head{padding:20px 20px 6px;display:flex;align-items:flex-end;justify-content:space-between;}
.hello{font-size:12px;color:#7d7a70;letter-spacing:.5px;text-transform:uppercase;}
.title{font-size:23px;font-weight:600;margin-top:2px;letter-spacing:-.4px;}
.rf{width:36px;height:36px;border-radius:12px;border:.5px solid var(--line);background:rgba(255,255,255,.7);color:var(--mint-d);font-size:17px;}
.rf.putar{animation:sp .8s linear infinite;}
.chips{display:flex;gap:8px;padding:8px 16px 14px;overflow-x:auto;}
.chips::-webkit-scrollbar{display:none;}
.chip{border-radius:14px;padding:9px 16px;font-size:13px;white-space:nowrap;flex-shrink:0;background:rgba(255,255,255,.66);border:.5px solid var(--line);color:var(--txt2);}
.chip.on{background:#9EEBCF;color:#0B4A37;font-weight:600;border-color:#9EEBCF;}
.body{padding:0 14px;}
.masuk{animation:rise .35s cubic-bezier(.22,1,.36,1);}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.seclbl{font-size:12px;color:#7d7a70;font-weight:600;margin:14px 6px 8px;display:flex;justify-content:space-between;align-items:center;}
.badge{background:rgba(240,159,39,.25);color:var(--warn);border-radius:8px;padding:2px 9px;font-size:12px;}
/* kartu: kaca "palsu" (putih transparan + garis terang) — TANPA blur, jauh lebih ringan */
.card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;margin-bottom:10px;
  background:rgba(255,255,255,.66);border:.5px solid var(--line);box-shadow:0 2px 10px rgba(90,84,70,.06);contain:layout paint;}
.card.on{background:rgba(214,245,233,.9);border-color:rgba(63,185,138,.5);}
.card.done .nm{text-decoration:line-through;color:#b4b2a9;}
.card.tunggu{opacity:.55;}
.pic{width:48px;height:48px;border-radius:12px;flex-shrink:0;position:relative;background:rgba(255,255,255,.75);
  display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:20px;}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:12px;}
.pic.ada{transition:width .25s ease,height .25s ease;cursor:zoom-in;}
.pic.besar{width:96px;height:96px;cursor:default;}
.pic.besar .check{display:none;}
.px{display:none;position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;
  background:rgba(34,37,31,.85);color:#fff;font-size:13px;line-height:22px;text-align:center;padding:0;}
.pic.besar .px{display:block;}
.check{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--mint);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;border:3px solid #fff;}
.info{flex:1;min-width:0;}
.nm{font-size:15px;font-weight:600;letter-spacing:-.2px;}
.sub{font-size:12px;color:var(--txt3);margin-top:2px;}
.note{font-size:11px;color:var(--mint-d);margin-top:4px;}
.pill{font-size:10px;padding:2px 8px;border-radius:8px;margin-left:5px;}
.pill-p{background:rgba(127,110,220,.18);color:#4b3f9c;}
.pill-new{background:rgba(240,159,39,.22);color:var(--warn);}
.act{flex-shrink:0;display:flex;align-items:center;}
.add{width:40px;height:40px;border-radius:12px;border:.5px solid var(--line);background:rgba(255,255,255,.8);color:var(--mint-d);font-size:22px;}
.stp{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.7);border-radius:16px;padding:4px;}
.stp button{width:34px;height:34px;border-radius:11px;border:none;background:#fff;font-size:18px;color:var(--mint-d);}
.stp span{min-width:26px;text-align:center;font-weight:600;font-size:15px;}
.ib{width:38px;height:38px;border-radius:11px;border:.5px solid var(--line);background:rgba(255,255,255,.8);
  display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-left:6px;}
.ib.ok{color:var(--mint-d);} .ib.no{color:var(--danger);}
button:active,.chip:active,.cta:active,.btn2:active,.wa:active{transform:scale(.95);}
.tulis{text-align:center;font-size:14px;color:var(--mint);padding:14px;}
.float{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:488px;
  padding:15px 20px;border-radius:20px;z-index:3;background:#3FB98A;color:#fff;font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 26px rgba(12,91,68,.28);
  transform:translate(-50%,120px);transition:transform .3s cubic-bezier(.34,1.3,.64,1);}
.float.show{transform:translate(-50%,0);}
.cta{margin:10px 6px;padding:15px;border-radius:18px;text-align:center;font-size:15px;font-weight:600;background:#3FB98A;color:#fff;
  box-shadow:0 6px 18px rgba(12,91,68,.2);display:flex;align-items:center;justify-content:center;gap:7px;}
.btn2{padding:13px;border-radius:16px;font-size:14px;font-weight:600;text-align:center;border:.5px solid var(--line);
  background:rgba(255,255,255,.66);color:var(--txt2);}
.cek{cursor:pointer;}
.kotak{width:28px;height:28px;border-radius:8px;border:2px solid #b9b4a8;background:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:700;}
.kotak.on{background:var(--mint);border-color:var(--mint);}
.jml{font-weight:500;color:var(--txt2);}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 6px 8px;}
.scard{background:rgba(255,255,255,.66);border:.5px solid var(--line);border-radius:14px;padding:12px;}
.snum{font-size:24px;font-weight:600;}
.wa{display:flex;align-items:center;gap:12px;margin-bottom:9px;padding:14px;border-radius:16px;
  border:.5px solid rgba(63,185,138,.5);background:rgba(63,185,138,.16);color:var(--mint-d);text-decoration:none;}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,20,18,.4);display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:520px;background:#F6F3EC;border-radius:22px 22px 0 0;padding:20px 18px calc(26px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.22,1,.36,1);}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
.sheet h3{margin:0 0 14px;font-size:17px;}
.fld{margin-bottom:12px;}
.fld label{font-size:12px;color:var(--txt2);display:block;margin-bottom:5px;}
.fld input,.fld textarea{width:100%;padding:12px;border-radius:12px;border:.5px solid #ddd8cd;background:#fff;font-size:16px;font-family:inherit;}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;z-index:40;background:var(--mint-d);color:#fff;
  padding:12px 20px;border-radius:14px;font-size:14px;opacity:0;transform:translate(-50%,20px);transition:opacity .25s,transform .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.err{background:var(--danger);}
.loading{text-align:center;padding:60px 20px;color:var(--txt3);}
.spin{width:32px;height:32px;border:3px solid rgba(63,185,138,.2);border-top-color:var(--mint);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.kosong{text-align:center;padding:40px 20px;color:var(--txt3);font-size:14px;}
</style>
</head>
<body>
<div class="bg"></div>
<div id="app"><div class="loading"><div class="spin"></div>Memuat…</div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= PENGATURAN ================= */
var API = "/api";
var KUNCI_KELUARGA = "161010";
var CACHE_KEY = "br_data_v2";

/* ================= STATUS ================= */
var DB = {kategori:[], master:[], pengguna:[], belanja:[]};
var MODE = 'art', namaSaya = '', kategoriAktif = '';
var keranjang = {};          // ART: id -> {jumlah, catatan, jenis, nama, satuan, baru}
var antre = [];              // antrean tulis (dijalankan berurutan)
var sibuk = false;
var sudahTampil = false;

/* ================= JARINGAN ================= */
function panggil(params){
  var qs = [];
  for (var k in params) if (params[k] !== undefined && params[k] !== null) qs.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
  return fetch(API+'?'+qs.join('&'), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(res){ if(!res || !res.ok) throw new Error((res && res.pesan) || 'Server menolak'); return res; });
}

/* Tulis: masuk antrean, dijalankan satu per satu di belakang layar.
   Layar sudah diubah lebih dulu (optimistis). Balasan server = data terbaru. */
function tulis(params){
  antre.push(params);
  if (!sibuk) jalankanAntre();
}
function jalankanAntre(){
  if (!antre.length){ sibuk = false; return; }
  sibuk = true;
  var p = antre.shift();
  panggil(p).then(function(res){
    if (res.data && !antre.length){ DB.belanja = res.data.belanja; simpanCache(); gambarTab(); }
    jalankanAntre();
  }).catch(function(){
    antre = []; sibuk = false;
    toast('Gagal menyimpan. Memuat ulang…', true);
    segarkan();
  });
}

/* ================= CACHE DI HP ================= */
function bacaCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){ return null; } }
function simpanCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(DB)); }catch(e){} }

/* ================= MULAI ================= */
(function mulai(){
  var q = new URLSearchParams(location.search);
  if (q.get('mode')==='keluarga' && q.get('k')===KUNCI_KELUARGA) MODE='keluarga';
  var c = bacaCache();
  if (c && c.master && c.master.length){ for (var k in DB) if (c[k]) DB[k] = c[k]; tampilAwal(); }   // tampil seketika dari HP
  segarkan();                                                     // lalu perbarui diam-diam
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && !sibuk) segarkan(); });
})();

function tampilAwal(){
  sudahTampil = true;
  if (MODE==='art') mulaiART(); else renderKeluarga();
}
function segarkan(){
  var rf = document.getElementById('rf'); if (rf) rf.classList.add('putar');
  panggil({action: MODE==='art' ? 'awal' : 'semua'}).then(function(res){
    if (sibuk) return;                       // ada tulis yang sedang jalan; balasannya yang dipakai
    var d = res.data;
    DB.kategori = d.kategori; DB.master = d.master; DB.pengguna = d.pengguna;
    if (d.belanja) DB.belanja = d.belanja;
    simpanCache();
    if (!sudahTampil) tampilAwal();
    else if (MODE==='keluarga') gambarTab();
    else if (document.getElementById('daftar')) { renderChips(); renderBarang(false); }
  }).catch(function(e){
    if (!sudahTampil) document.getElementById('app').innerHTML='<div class="kosong">Gagal memuat.<br>'+esc(e.message)+'<br><br><div class="cta" onclick="location.reload()">Coba lagi</div></div>';
    else toast('Tidak tersambung — menampilkan data terakhir', true);
  }).then(function(){ var rf=document.getElementById('rf'); if(rf) rf.classList.remove('putar'); });
}

/* ================= ALAT ================= */
function $(id){ return document.getElementById(id); }
function sapaan(){ var j=new Date().getHours(); return j<11?'Selamat pagi':j<15?'Selamat siang':j<18?'Selamat sore':'Selamat malam'; }
var _tt;
function toast(t, err){ var e=$('toast'); e.textContent=t; e.className='toast show'+(err?' err':''); clearTimeout(_tt); _tt=setTimeout(function(){ e.className='toast'+(err?' err':''); }, 2400); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function tmpId(){ return 'tmp_'+Date.now()+Math.floor(Math.random()*1000); }

/* ======================= ART ======================= */
function mulaiART(){
  try{ namaSaya = localStorage.getItem('namaSaya') || ''; }catch(e){}
  if (!namaSaya) pilihNama(); else renderART();
}
function pilihNama(){
  var h='<div class="head"><div><div class="hello">'+sapaan()+'</div><div class="title">Siapa Anda?</div></div></div><div class="body masuk">';
  DB.pengguna.filter(function(p){return p.peran==='art';}).forEach(function(p){
    h+='<div class="card" data-nama="'+esc(p.nama)+'"><div class="pic">👤</div><div class="info"><div class="nm">'+esc(p.nama)+'</div></div><div class="act"><span class="ib ok">→</span></div></div>';
  });
  $('app').innerHTML = h+'</div>';
  $('app').onclick = function(e){ var c=e.target.closest('[data-nama]'); if(!c) return;
    namaSaya=c.getAttribute('data-nama'); try{localStorage.setItem('namaSaya',namaSaya);}catch(x){} $('app').onclick=null; renderART(); };
}
function renderART(){
  $('app').onclick = null;
  if (!kategoriAktif || !DB.kategori.some(function(k){return k.nama===kategoriAktif;})) kategoriAktif = DB.kategori.length ? DB.kategori[0].nama : '';
  $('app').innerHTML =
    '<div class="head"><div><div class="hello">'+sapaan()+', '+esc(namaSaya)+'</div><div class="title">Belanja rumah</div></div></div>'
    +'<div class="chips" id="chips"></div><div class="body" id="daftar"></div>'
    +'<div class="float" id="float"><span>🛒 <span id="cnt">0</span> barang</span><span>Periksa →</span></div>';
  $('float').onclick = periksa;
  $('chips').onclick = function(e){ var c=e.target.closest('.chip'); if(!c) return;
    kategoriAktif = c.getAttribute('data-k'); tandaiChip(); renderBarang(true); window.scrollTo(0,0); };
  /* satu pendengar untuk semua kartu (bukan satu per kartu) */
  $('daftar').onclick = function(e){
    if (klikFoto(e)) return;
    var b = e.target.closest('[data-a]'), card = e.target.closest('.card');
    if (b){ var id=b.closest('.card').getAttribute('data-id'), a=b.getAttribute('data-a');
      if (a==='plus') ubah(id,1); else if (a==='min') ubah(id,-1); return; }
    if (e.target.closest('.tulis')){ tulisBarang(e.target.closest('.tulis').getAttribute('data-j')); return; }
    if (card && keranjang[card.getAttribute('data-id')]) catatan(card.getAttribute('data-id'));
  };
  renderChips(); renderBarang(true); renderFloat();
}
function renderChips(){
  $('chips').innerHTML = DB.kategori.map(function(k){
    return '<div class="chip'+(k.nama===kategoriAktif?' on':'')+'" data-k="'+esc(k.nama)+'">'+esc(k.nama)+'</div>'; }).join('');
}
function tandaiChip(){ var cs=$('chips').children; for(var i=0;i<cs.length;i++) cs[i].classList.toggle('on', cs[i].getAttribute('data-k')===kategoriAktif); }
function fotoUrl(f){ if(!f) return ''; return /^https?:\/\//i.test(f) ? f : 'foto/'+encodeURIComponent(String(f).trim()); }
function htmlPic(foto, extra){
  if (!foto) return '<div class="pic">📷'+(extra||'')+'</div>';
  return '<div class="pic ada"><img src="'+esc(fotoUrl(foto))+'" loading="lazy" decoding="async" alt="" onerror="this.parentNode.classList.remove(\'ada\');this.remove()">'
    +(extra||'')+'<button class="px" aria-label="Kecilkan">✕</button></div>';
}
/* ketuk foto = membesar 2x; ✕ di sudut kanan = kembali kecil. Mengembalikan true bila klik sudah ditangani. */
function klikFoto(e){
  var x = e.target.closest('.px'); if (x){ x.parentNode.classList.remove('besar'); e.stopPropagation(); return true; }
  var p = e.target.closest('.pic.ada'); if (p){ p.classList.add('besar'); e.stopPropagation(); return true; }
  return false;
}
function masterById(id){ for(var i=0;i<DB.master.length;i++) if(DB.master[i].id===id) return DB.master[i]; return null; }
function htmlKartu(m){
  var k = keranjang[m.id], q = k ? k.jumlah : 0;
  var pic = htmlPic(m.foto, q>0?'<span class="check">✓</span>':'');
  return '<div class="card'+(q>0?' on':'')+'" data-id="'+esc(m.id)+'">'+pic
    +'<div class="info"><div class="nm">'+esc(m.nama)+'</div><div class="sub">'+esc(m.satuan)+'</div>'
    +(k && k.catatan ? '<div class="note">✎ '+esc(k.catatan)+'</div>' : (q>0?'<div class="note" style="color:var(--txt3)">Ketuk kartu untuk catatan</div>':''))+'</div>'
    +'<div class="act">'+(q>0
      ? '<div class="stp"><button data-a="min">−</button><span>'+q+'</span><button data-a="plus">+</button></div>'
      : '<button class="add" data-a="plus">+</button>')+'</div></div>';
}
function renderBarang(animasi){
  var list = DB.master.filter(function(m){ return m.kategori===kategoriAktif; });
  var h = list.length ? list.map(htmlKartu).join('') : '<div class="kosong">Belum ada barang di kategori ini.</div>';
  h += '<div class="tulis" data-j="rumah">✎ Barang tidak ada di sini? Tulis sendiri</div>'
     + '<div class="tulis" data-j="pribadi" style="color:#4b3f9c">＋ Keperluan pribadi</div>';
  var w = $('daftar'); w.innerHTML = h;
  if (animasi){ w.classList.remove('masuk'); void w.offsetWidth; w.classList.add('masuk'); }
}
/* ubah jumlah: hanya kartu itu yang diganti — tidak menggambar ulang seluruh daftar */
function ubah(id, d){
  var m = masterById(id); if (!m) return;
  var cur = keranjang[id] ? keranjang[id].jumlah : 0, baru = cur + d;
  if (baru <= 0) delete keranjang[id];
  else { if (!keranjang[id]) keranjang[id] = {jumlah:0, catatan:'', jenis:'rumah', nama:m.nama, satuan:m.satuan}; keranjang[id].jumlah = baru; }
  gantiKartu(m); renderFloat();
}
function gantiKartu(m){
  var lama = $('daftar').querySelector('[data-id="'+(window.CSS&&CSS.escape?CSS.escape(m.id):m.id)+'"]');
  if (!lama) return;
  var t = document.createElement('div'); t.innerHTML = htmlKartu(m);
  lama.parentNode.replaceChild(t.firstChild, lama);
}
function renderFloat(){ var n=Object.keys(keranjang).length; $('cnt').textContent=n; $('float').classList.toggle('show', n>0); }
function catatan(id){
  var m = masterById(id);
  modal('Catatan untuk '+m.nama, [{key:'catatan', label:'Catatan (mis. merek yang biasa)', val:keranjang[id].catatan, area:true}],
    function(v){ keranjang[id].catatan = v.catatan; gantiKartu(m); });
}
function tulisBarang(jenis){
  modal(jenis==='pribadi'?'Keperluan pribadi':'Barang baru',
    [{key:'nama',label:'Nama barang',val:''},{key:'jumlah',label:'Jumlah',val:'1',num:true},
     {key:'satuan',label:'Satuan (mis. bks, kg, botol)',val:''},{key:'catatan',label:'Catatan (opsional)',val:'',area:true}],
    function(v){ if(!v.nama){ toast('Nama belum diisi', true); return false; }
      keranjang['baru_'+Date.now()] = {jumlah:Number(v.jumlah)||1, catatan:v.catatan, jenis:jenis, nama:v.nama, satuan:v.satuan, baru:true};
      renderFloat(); toast('Ditambahkan ke keranjang'); });
}
function periksa(){
  var ids = Object.keys(keranjang); if (!ids.length) return;
  var h = '<div class="head"><div><div class="hello">'+esc(namaSaya)+'</div><div class="title">Periksa pesanan</div></div></div><div class="body masuk">';
  ids.forEach(function(id){ var k=keranjang[id];
    h += '<div class="card"><div class="info"><div class="nm">'+esc(k.nama)+' × '+k.jumlah+' '+esc(k.satuan||'')
      +(k.baru?' <span class="pill pill-new">baru</span>':'')+(k.jenis==='pribadi'?' <span class="pill pill-p">pribadi</span>':'')+'</div>'
      +(k.catatan?'<div class="note">✎ '+esc(k.catatan)+'</div>':'')+'</div>'
      +'<div class="act"><button class="ib no" data-hapus="'+esc(id)+'">🗑</button></div></div>'; });
  h += '<div class="cta" id="btnKirim">📩 Minta dibelikan</div><div class="btn2" style="margin:0 6px" id="btnBalik">← Kembali</div></div>';
  $('app').innerHTML = h;
  $('app').onclick = function(e){ var b=e.target.closest('[data-hapus]'); if(!b) return;
    delete keranjang[b.getAttribute('data-hapus')]; if(Object.keys(keranjang).length) periksa(); else renderART(); };
  $('btnKirim').onclick = kirim; $('btnBalik').onclick = renderART;
}
function kirim(){
  var daftar = Object.keys(keranjang).map(function(id){ var k=keranjang[id];
    return {idBarang:(k.baru?'':id), nama:k.nama, jumlah:k.jumlah, satuan:k.satuan||'', catatan:k.catatan||'', jenis:k.jenis||'rumah'}; });
  var b = $('btnKirim'); b.innerHTML = '<div class="spin" style="width:18px;height:18px;margin:0;border-width:2px;border-color:rgba(255,255,255,.4);border-top-color:#fff"></div> Mengirim…'; b.onclick = null;
  panggil({action:'kirimPermintaan', pemesan:namaSaya, payload:JSON.stringify({daftar:daftar})})
    .then(function(){ keranjang = {}; selesaiART(); })
    .catch(function(){ toast('Gagal mengirim. Coba lagi.', true); periksa(); });
}
function selesaiART(){
  $('app').onclick = null;
  $('app').innerHTML = '<div class="kosong masuk" style="padding-top:90px"><div style="font-size:56px;color:var(--mint)">✓</div>'
    +'<div style="font-size:18px;color:var(--mint-d);font-weight:600;margin-top:10px">Sudah terkirim ke Bapak</div>'
    +'<div class="cta" style="max-width:220px;margin:24px auto 0" id="btnAwal">Kembali ke awal</div></div>';
  $('btnAwal').onclick = renderART;
}

/* ======================= KELUARGA ======================= */
/* Satu layar: daftar pesanan + kotak centang. Selesai belanja -> rekap yang tidak dicentang -> WA ke ART. */
function renderKeluarga(){ $('app').onclick = aksiKeluarga; gambarTab(true); }
function gambarTab(animasi){
  if (MODE!=='keluarga') return;
  var urut = {}; DB.kategori.forEach(function(k){ urut[k.nama]=k.urut; });
  var katBarang = {}, fotoBarang = {}; DB.master.forEach(function(m){ katBarang[m.id]=m.kategori; fotoBarang[m.id]=m.foto; });
  function posisi(b){ return urut[katBarang[b.idBarang]] || 999; }
  var list = DB.belanja.slice().sort(function(a,b){
    var da=a.status==='dibeli'?1:0, db=b.status==='dibeli'?1:0;
    return da-db || posisi(a)-posisi(b) || String(a.nama).localeCompare(String(b.nama)); });
  var sudah = list.filter(function(b){ return b.status==='dibeli'; }).length;

  var h = '<div class="head"><div><div class="hello">'+sapaan()+'</div><div class="title">Daftar belanja</div>'
    +(list.length?'<div class="sub" style="margin-top:4px">'+sudah+' dari '+list.length+' sudah dibeli</div>':'')+'</div>'
    +'<button class="rf" id="rf" data-aksi="segar" aria-label="Muat ulang">⟳</button></div><div class="body'+(animasi?' masuk':'')+'">';
  if (!list.length) h += '<div class="kosong">Belum ada pesanan.</div>';
  list.forEach(function(b){
    var ok = b.status==='dibeli', tmp = String(b.id).indexOf('tmp_')===0;
    h += '<div class="card cek'+(ok?' done':'')+(tmp?' tunggu':'')+'"'+(tmp?'':' data-aksi="centang" data-id="'+esc(b.id)+'"')+'>'
      +'<div class="kotak'+(ok?' on':'')+'">'+(ok?'✓':'')+'</div>'+(fotoBarang[b.idBarang]?htmlPic(fotoBarang[b.idBarang]):'')
      +'<div class="info"><div class="nm">'+esc(b.nama)+' <span class="jml">× '+esc(b.jumlah)+' '+esc(b.satuan)+'</span>'
      +(b.jenis==='pribadi'?' <span class="pill pill-p">pribadi</span>':'')+'</div>'
      +'<div class="sub">'+esc(b.pemesan)+(b.catatan?' · '+esc(b.catatan):'')+(tmp?' · menyimpan…':'')+'</div></div></div>';
  });
  h += '<div class="tulis" data-aksi="tambah">＋ Tambah barang</div>';
  if (list.length) h += '<div class="cta" data-aksi="selesai">🏁 Selesai belanja</div>';
  $('app').innerHTML = h + '</div>';
}

function aksiKeluarga(e){
  if (klikFoto(e)) return;
  var a = e.target.closest('[data-aksi]'); if (!a) return;
  var aksi = a.getAttribute('data-aksi'), id = a.getAttribute('data-id');
  if (aksi==='segar') segarkan();
  else if (aksi==='centang'){
    var st = 'dibeli';
    DB.belanja.forEach(function(b){ if (b.id===id){ st = b.status==='dibeli' ? 'belum' : 'dibeli'; b.status = st; } });
    gambarTab(); simpanCache(); tulis({action:'tandai', id:id, status:st});
  }
  else if (aksi==='tambah') tambahKel();
  else if (aksi==='selesai') layarSelesai();
}

/* Rekap: barang rumah yang tidak dicentang -> ke semua ART; barang pribadi -> ke yang pesan */
function layarSelesai(){
  var belum = DB.belanja.filter(function(b){ return b.status!=='dibeli'; });
  var rumah = belum.filter(function(b){ return b.jenis!=='pribadi'; }), pribadi = {};
  belum.forEach(function(b){ if (b.jenis==='pribadi') (pribadi[b.pemesan]=pribadi[b.pemesan]||[]).push(b); });
  var tombol = [];
  DB.pengguna.filter(function(p){ return p.peran==='art'; }).forEach(function(a){
    var isi = rumah.concat(pribadi[a.nama]||[]);
    if (isi.length) tombol.push({nama:a.nama, wa:a.wa, n:isi.length, teks:pesanWA(a.nama, isi)});
  });
  var dibeli = DB.belanja.length - belum.length;
  var h = '<div class="sheet"><h3>Selesai belanja</h3>'
    +'<div class="stat" style="padding:0 0 12px"><div class="scard"><div class="sub">Dibeli</div><div class="snum">'+dibeli+'</div></div>'
    +'<div class="scard"><div class="sub">Tidak dapat</div><div class="snum" style="color:var(--danger)">'+belum.length+'</div></div></div>';
  if (tombol.length){
    h += '<div class="sub" style="margin:0 2px 8px">Kirim rekap yang tidak dapat ke WhatsApp:</div>';
    tombol.forEach(function(t){
      h += '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+esc(t.wa)+'?text='+encodeURIComponent(t.teks)+'">'
        +'<div style="font-size:22px">🟢</div><div style="flex:1"><div style="font-weight:600">Kirim ke '+esc(t.nama)+'</div><div style="font-size:11px">'+t.n+' barang</div></div><div>›</div></a>';
    });
  } else h += '<div class="kosong" style="padding:10px">Semua barang sudah dibeli 👍</div>';
  h += '<div style="display:flex;gap:10px;margin-top:10px" id="sTombol"><div class="btn2" style="flex:1" id="sBatal">Batal</div>'
    +'<div class="cta" style="flex:1;margin:0" id="sOk">Selesai &amp; kosongkan</div></div></div>';
  var ov = document.createElement('div'); ov.className='overlay'; ov.innerHTML=h; document.body.appendChild(ov);
  var sudahKosong = false;
  function tutup(){ if (ov.parentNode) document.body.removeChild(ov); }
  /* Kosongkan daftar sekali saja: dipicu oleh tombol WA pertama ATAU tombol Selesai */
  function kosongkan(){
    if (sudahKosong) return; sudahKosong = true;
    DB.belanja = []; gambarTab(true); simpanCache(); tulis({action:'selesaikan'});
    ov.querySelector('#sTombol').innerHTML = '<div class="cta" style="flex:1;margin:0" id="sTutup">Tutup</div>';
    ov.querySelector('#sTutup').onclick = tutup;
    toast('Daftar dikosongkan & tersimpan ke riwayat');
  }
  ov.onclick = function(e){
    if (e.target.closest('.wa')) { kosongkan(); return; }      // link WA tetap terbuka seperti biasa
    if (e.target===ov && !sudahKosong) tutup();
  };
  ov.querySelector('#sBatal').onclick = tutup;
  ov.querySelector('#sOk').onclick = function(){ kosongkan(); tutup(); };
}
function pesanWA(tujuan, list){
  var t = 'Halo '+tujuan+', barang ini tidak dapat di toko:\n';
  list.forEach(function(b,i){ t += (i+1)+'. '+b.nama+' — '+b.jumlah+' '+(b.satuan||'')+(b.jenis==='pribadi'?' (titipan pribadi)':'')+'\n'; });
  return t + 'Terima kasih 🙏';
}
function tambahKel(){
  modal('Tambah barang', [{key:'nama',label:'Nama barang',val:''},{key:'jumlah',label:'Jumlah',val:'1',num:true},
    {key:'satuan',label:'Satuan',val:''},{key:'catatan',label:'Catatan (opsional)',val:'',area:true}],
    function(v){ if(!v.nama){ toast('Nama belum diisi', true); return false; }
      var j = Number(v.jumlah)||1;
      DB.belanja.push({id:tmpId(), idBarang:'', nama:v.nama, jumlah:j, satuan:v.satuan, catatan:v.catatan, pemesan:'Keluarga', jenis:'rumah', status:'belum'});
      gambarTab(); simpanCache(); tulis({action:'tambahBelanja', nama:v.nama, jumlah:j, satuan:v.satuan, catatan:v.catatan}); });
}

/* ======================= MODAL ======================= */
function modal(judul, fields, onSave){
  var ov = document.createElement('div'); ov.className = 'overlay';
  var h = '<div class="sheet"><h3>'+esc(judul)+'</h3>';
  fields.forEach(function(f){ h += '<div class="fld"><label>'+esc(f.label)+'</label>'
    +(f.area ? '<textarea id="f_'+f.key+'" rows="2">'+esc(f.val)+'</textarea>'
             : '<input id="f_'+f.key+'" '+(f.num?'type="tel" inputmode="numeric" pattern="[0-9]*"':'type="text"')+' value="'+esc(f.val)+'">')+'</div>'; });
  h += '<div style="display:flex;gap:10px;margin-top:8px"><div class="btn2" style="flex:1" id="mBatal">Batal</div><div class="cta" style="flex:1;margin:0" id="mSimpan">Simpan</div></div></div>';
  ov.innerHTML = h; document.body.appendChild(ov);
  function tutup(){ if (ov.parentNode) document.body.removeChild(ov); }
  ov.onclick = function(e){ if (e.target===ov) tutup(); };
  ov.querySelector('#mBatal').onclick = tutup;
  ov.querySelector('#mSimpan').onclick = function(){ var v={}; fields.forEach(function(f){ v[f.key]=document.getElementById('f_'+f.key).value.trim(); });
    if (onSave(v)!==false) tutup(); };
  var first = ov.querySelector('input,textarea'); if (first) setTimeout(function(){ first.focus(); }, 280);
}

/* ======================= PWA ======================= */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(function(){});
</script>
